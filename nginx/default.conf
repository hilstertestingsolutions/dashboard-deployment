server {
    listen 80;
    listen [::]:80;

    client_max_body_size 2048M;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/x-javascript text/xml application/xml application/xml+rss;

    # dashboard frontend
    location / {
        # Resolve the upstream hostname at runtime via docker's embedded DNS
        # instead of once at startup. Otherwise nginx exits with
        # "[emerg] host not found in upstream" if the dashboard container is
        # not resolvable when the proxy (re)starts, and never notices when
        # the dashboard container is recreated with a different IP address.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $dashboard_upstream http://dashboard:8080;
        proxy_pass $dashboard_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Scheme $scheme;
    }
}
